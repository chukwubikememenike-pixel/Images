<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaning Javascript</title>
    <!-- introduction javascript into our file  -->
     <style>
        body {
        background-color: rgb(246, 246, 174);
        }

        section {
            background: white;
            padding: 1rem;
        }

        form {
            display: flex;
            gap: 0.7rem;
        }
        label {}

        input {
            padding:0.6rem 0.9rem;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
        }

        input {
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;

        }

        input:focus {
            border-color: #4f46e5;
        }

        .add-btn {
            padding: 0.6rem 1rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }

        .add-btn:hover{
            background: #4338ca;
        }

        .summary {
            font-size: 0.9rem;
            color: #292a2c;
            margin-bottom: 1rem;
        }

        li button {
            background: none;
            border: 1px solid #f87171;
            color: #ef4444;
            border-redius: 6px;
            padding: 0.2rem 0.6rem;
            font-size:0.8rem;
            cursor: pointer

        }

        li button:hover {
            background: #fee2e2;
        }
     </style>


</head>

<body>
    <h1>Introduction to Javascript</h1>

    <section>
        <h2> Shopping List 🛍️</h2>
        <p class="summary"></p>
        <form>
            <div>
                <label for="itemContent"> Add an item</label>
            <input type="text" name="itemContent" id="itemContent" placeholder="add an item">
            </div>
            <button type="submit"class="add-btn"> And</button>
        </form>

        <ul>
            
        </ul>
        
    </section>
    
    <!-- introduction javascript into our file -->
     <!-- <script></script> -->
    
    <script src="Practice2.js"></script>
</body>



</html>
